<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korean Grammar Practice</title>
<meta name="theme-color" content="#d9544d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="문법 연습">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #fdf3e7; --card: #ffffff; --ink: #2b2522; --muted: #7a6f69;
    --accent: #d9544d; --accent-ink: #ffffff; --line: #ecdccb;
    --good: #2e8b57; --good-bg: #e3f4ea; --bad: #c0392b; --bad-bg: #fbe5e2;
    --chip: #f6e6d4; --locked: #e9e2db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1a18; --card: #2a2522; --ink: #f3ece6; --muted: #b3a79f;
      --accent: #e8665f; --accent-ink: #1e1a18; --line: #3d3531;
      --good: #6fcf97; --good-bg: #1f3a2b; --bad: #ff8a7a; --bad-bg: #44241f;
      --chip: #3a322d; --locked: #2f2925;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 620px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 8px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 24px 0 10px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font-weight: 650; font-size: 17px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.secondary { background: var(--chip); color: var(--ink); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .icon-btn { padding: 8px 10px; border-radius: 10px; color: var(--muted); font-size: 15px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }

  /* chapter grid */
  .chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .ch { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .ch b { display: block; font-size: 18px; }
  .ch span { font-size: 12px; color: var(--muted); }
  .ch.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .ch.locked { background: var(--locked); color: var(--muted); border-style: dashed; cursor: default; }
  .whole { margin-bottom: 8px; }
  .whole-btn.sel { background: var(--accent); color: var(--accent-ink); }
  .selinfo { margin: 12px 0 14px; font-size: 15px; }

  /* quiz */
  .bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 6px 0 18px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .kind { font-size: 13px; font-weight: 650; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
  .q { font-size: 24px; line-height: 1.5; margin: 10px 0 6px; word-break: keep-all; }
  .q .blank { display: inline-block; min-width: 2.6em; border-bottom: 3px solid var(--accent); text-align: center; padding: 0 4px; }
  .hint { font-size: 15px; color: var(--muted); margin-bottom: 14px; }
  .opts { display: grid; gap: 10px; margin-top: 14px; }
  .opt { text-align: left; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-size: 20px; }
  .opt.right { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  input.answer { width: 100%; font-size: 22px; padding: 14px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); margin: 6px 0 12px; }
  input.answer:focus { outline: none; border-color: var(--accent); }
  .built { min-height: 62px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tile { padding: 10px 14px; border-radius: 10px; background: var(--chip); font-size: 20px; border: 1px solid var(--line); }
  .tile.used { visibility: hidden; }
  .feedback { border-radius: 12px; padding: 14px; margin: 14px 0; font-size: 16px; line-height: 1.5; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .feedback .ans { font-size: 20px; font-weight: 650; }
  .tip { margin-top: 8px; font-size: 15px; }
  .tip b { color: var(--accent); }

  /* results & stats */
  .big { font-size: 44px; font-weight: 750; margin: 4px 0; }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .list li:last-child { border-bottom: 0; }
  .stat { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .meter { flex: 0 0 90px; height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--good); }
  select { font: inherit; font-size: 17px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%; }
  textarea.answer { width: 100%; font: inherit; font-size: 21px; padding: 14px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); margin: 6px 0 12px; resize: vertical; }
  textarea.answer:focus { outline: none; border-color: var(--accent); }
  .free-card { display: block; width: 100%; text-align: left; line-height: 1.45; }
  .free-card b { font-size: 17px; }
  .free-card.sel { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .ctx { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--chip);
    border-radius: 0 10px 10px 0; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .say { margin: 2px 0 12px; font-size: 16px; line-height: 1.45; }
  .hidden { display: none !important; }
  .gch { margin-bottom: 12px; padding: 14px 16px; }
  .gch summary { cursor: pointer; font-size: 17px; list-style: none; display: flex; align-items: center; gap: 10px; }
  .gch summary > div { flex: 1; }
  .gch summary::-webkit-details-marker { display: none; }
  .gch summary::after { content: "›"; font-size: 22px; color: var(--muted); transition: transform .2s; }
  .gch[open] summary::after { transform: rotate(90deg); }
  .gram { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .gram h3 { margin: 0 0 4px; font-size: 18px; color: var(--accent); }
  .gram p { margin: 0 0 10px; }
  .gtable { width: 100%; border-collapse: collapse; font-size: 15px; margin-bottom: 10px; }
  .gtable td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .gex { list-style: none; padding: 0; margin: 0 0 8px; }
  .gex li { padding: 6px 0; }
  .gex .ko { display: block; font-size: 17px; }
  .gwatch { background: var(--chip); border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-bottom: 4px; }
  .gch .btn { margin-top: 12px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="irregular.js"></script>
<script src="free.js"></script>
<script src="grammar.js"></script>
<script src="app.js"></script>
</body>
</html>
